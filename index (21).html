<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Order Book">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dental Order Book</title>
<meta name="color-scheme" content="light dark">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B6E4F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen field app — sticky header, scrolling work area, thumb-reach tab bar; admin widens to a two-column desk view. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E9EEEB; --ink:#13201C; --muted:#5D6B66; --line:#D7DFDB;
  --accent:#0B6E4F; --accent-ink:#FFFFFF; --accent-soft:#DDEFE7;
  --warn:#A5580B; --warn-soft:#FCEFDD; --danger:#B42318; --danger-soft:#FBE9E7; --ok:#1E7B3A; --ok-soft:#E1F3E5;
  --f-display:"Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --tabbar:60px; --bbar:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201C; --sunk:#1C2824; --ink:#E5EDEA; --muted:#93A39D; --line:#28352F;
  --accent:#3CC598; --accent-ink:#04241A; --accent-soft:#15352A;
  --warn:#F2A54E; --warn-soft:#3A2712; --danger:#FF8075; --danger-soft:#3D1714; --ok:#5BD07E; --ok-soft:#163222; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201C; --sunk:#1C2824; --ink:#E5EDEA; --muted:#93A39D; --line:#28352F;
  --accent:#3CC598; --accent-ink:#04241A; --accent-soft:#15352A;
  --warn:#F2A54E; --warn-soft:#3A2712; --danger:#FF8075; --danger-soft:#3D1714; --ok:#5BD07E; --ok-soft:#163222; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;text-size-adjust:100%;margin:0;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,a,.chip,select,summary{touch-action:manipulation}
.tabbar,.btn,.chip,.payopt,.add,.stepper button{-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- shell ---------- */
#app{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{flex:none;position:relative;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;display:flex;align-items:center;gap:10px}
.brandmark{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brandmark .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brandmark b{font-family:var(--f-display);font-size:16px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.wait i{background:var(--warn)}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-block:14px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px))}
.has-bbar .main{padding-bottom:calc(var(--tabbar) + var(--bbar) + 24px + env(safe-area-inset-bottom,0px))}
.typing .main{padding-bottom:16px}
.typing .tabbar,.typing .bbar{display:none}
.typing .catbar .visiting,.typing .catbar .filters{display:none}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{min-width:0;height:var(--tabbar);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;white-space:nowrap;font-weight:600;color:var(--muted);position:relative;cursor:pointer}
.tabbar button svg{width:22px;height:22px;flex:none}
.tabbar button span:not(.badge){max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-family:var(--f-mono);display:grid;place-items:center}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
.field label em{color:var(--danger);font-style:normal}
.input{width:100%;height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-size:16px}
textarea.input{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input.bad{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--danger);font-weight:600}
.btn{min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:7px 16px;font-weight:700;font-size:15px;line-height:1.2;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:inherit}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:4px 8px}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;font-size:13.5px;padding:5px 12px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--sunk);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.banner{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom,0px));width:max-content;text-align:center;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* MRP label — styled after the printed MRP box on Indian packs */
.mrp{display:inline-flex;align-items:baseline;gap:4px;border:1px solid var(--ink);border-radius:3px;padding:1px 6px;font-family:var(--f-mono);font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.mrp small{font-size:9.5px;letter-spacing:.06em;font-weight:500}
.mrp.none{border-style:dashed;border-color:var(--line);color:var(--muted)}

/* ---------- login ---------- */
.login{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-block:24px}
.login > .card{margin:auto}
.login .card{width:100%;max-width:400px;padding:22px;gap:16px}
.login h1{font-size:28px}
.login .logo{width:44px;height:44px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px}

/* ---------- visit ---------- */
.visit-live{border:2px solid var(--accent);background:var(--accent-soft)}
.visit-live h2{font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.loglist{display:flex;flex-direction:column}
.logitem{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.logitem:first-child{border-top:0}
.logitem b{display:block} .logitem span{font-size:12.5px;color:var(--muted)}

/* ---------- catalog ---------- */
.catbar{position:sticky;top:-14px;margin-top:-14px;z-index:4;background:var(--bg);padding-block:12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.visiting{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.visiting b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search .input{padding-left:40px;padding-right:40px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;border-radius:17px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.65;margin-left:4px}
.filters{display:flex;gap:8px}
.filters select{flex:1;min-width:0;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 0}
.sec-h h3{font-size:15px}
.sec-h span{font-size:12.5px;color:var(--muted)}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.prod:first-child{border-top:0}
.prod.incart{background:var(--accent-soft)}
.prod .nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;min-width:0}
.prod .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:3px}
.prod .meta .brand{color:var(--ink);font-weight:600}
.prod .gen{font-size:12px;color:var(--muted);margin-top:2px}
.add{height:38px;min-width:68px;padding:0 10px;border-radius:8px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;cursor:pointer}
.stepper{display:inline-grid;grid-template-columns:36px 42px 36px;height:38px;border:1.5px solid var(--accent);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:700;cursor:pointer;line-height:1}
.stepper input{border:0;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:15px;width:100%;background:var(--surface);padding:0}
.more{display:flex;justify-content:center;padding:4px}

/* ---------- cart ---------- */
.cline{display:flex;flex-direction:column;gap:10px;padding:14px;border-top:1px solid var(--line)}
.cline:first-child{border-top:0}
.cline .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cline .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cline .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.cline .grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:end}
.pricebox label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pricebox .wrapin{position:relative}
.pricebox .wrapin span{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);color:var(--muted)}
.pricebox .input{height:38px;min-width:0;padding-left:28px;font-family:var(--f-mono);font-weight:600}
.cline .calc{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap}
.cline .calc b{color:var(--ink);font-family:var(--f-mono)}
.x{border:0;background:none;color:var(--muted);width:34px;height:34px;font-size:18px;cursor:pointer;flex:none}
.totals{display:flex;flex-direction:column;gap:6px}
.note-in{height:38px;font-size:14px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:2px}
.track span{height:4px;border-radius:2px;background:var(--line)}
.track span.on{background:var(--accent)}
.track-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--danger-soft);color:var(--danger);font-weight:600;display:flex;gap:10px;justify-content:space-between;align-items:center}
.editbar{border:2px solid var(--warn);background:var(--warn-soft)}
.ocard.dead{opacity:.62}
.schips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.schips::-webkit-scrollbar{display:none}
.totals .spread{font-size:14px}
.totals .grand{font-family:var(--f-display);font-size:24px;font-weight:700}

/* ---------- orders (rep) ---------- */
.order{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px solid var(--line)}
.order:first-child{border-top:0}
.order .lines{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.order .lines div{display:flex;justify-content:space-between;gap:10px}
.order .lines div span:last-child{font-family:var(--f-mono);white-space:nowrap}

/* ---------- admin ---------- */
.admin .main{padding-bottom:40px}
.admin .wrap{max-width:1180px}
.atabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.atabs::-webkit-scrollbar{display:none}
.atabs button{flex:none;height:42px;border:0;background:none;padding:0 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.atabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media (max-width:600px){.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:first-child,.kpis .kpi-btn{grid-column:1/-1}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar input{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:14px;min-width:0}
.toolbar .grow{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow-x:auto;scrollbar-width:none;background:var(--surface);max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap;height:36px;border:0;background:none;padding:0 12px;font-weight:600;font-size:13.5px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ohead{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:12px 14px;cursor:pointer;align-items:center}
.ohead .who{min-width:0}
.ohead .who b{font-size:15px;overflow-wrap:anywhere}
.ohead .who div{font-size:12.5px;color:var(--muted)}
.ohead .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ohead .amt b{font-family:var(--f-mono);font-size:16px;display:block;white-space:nowrap}
.obody{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
table.t td.num{white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
.vsm{font-size:12px;color:var(--muted)}
.disc{font-size:11.5px;font-weight:700}
.disc.dn{color:var(--ok)} .disc.up{color:var(--danger)}
.badge.due{background:var(--danger);color:#FFFFFF}
/* payment */
.paycard{gap:12px}
.payopts{display:flex;flex-direction:column;gap:8px}
.payopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;cursor:pointer;color:inherit}
.payopt i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.payopt[aria-checked="true"] i{border-color:currentColor}
.payopt[aria-checked="true"] i::after{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.payopt b{display:block;font-size:15px;line-height:1.25}
.payopt small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.payopt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.payopt[aria-checked="true"][data-v="Credit"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.payopt[aria-checked="true"] small{color:inherit;opacity:.85}
.duebox.info{background:var(--accent-soft);color:var(--accent)}
.paymodes{display:flex;gap:8px;flex-wrap:wrap}
.days{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.days .input{width:76px;font-family:var(--f-mono);font-size:17px;text-align:center}
.days .chip{padding:0 11px}
a.btn{text-decoration:none;color:inherit}
.duebox{border-radius:8px;padding:9px 12px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:14px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 12px;border-radius:12px;background:#FFFFFF;color:#13201C;border:1px solid var(--line);color-scheme:light}
.qrbox .qr-img{width:min(230px,64vw);aspect-ratio:1}
.qrbox .qr-img svg{width:100%;height:100%;display:block}
.qr-amt{text-align:center;line-height:1.15}
.qr-amt span{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5D6B66}
.qr-amt b{display:block;font-family:var(--f-display);font-size:32px;font-variant-numeric:tabular-nums}
.qr-name{font-weight:700;font-size:14px}
.qr-vpa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.qr-vpa .mono{font-size:14px;overflow-wrap:anywhere}
.qrbox .btn{background:#FFFFFF;color:#0B6E4F;border-color:#D7DFDB}
.qrbox .note{font-size:12.5px;color:#5D6B66;text-align:center;max-width:300px}
.remind{border:2px solid var(--danger);gap:4px}
.remind.soon{border-color:var(--warn)}
.dueitem{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.dueitem:first-of-type{border-top:0}
.dueitem .who{min-width:0}
.dueitem .who span{display:block;font-size:12.5px;color:var(--muted)}
.paypick{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:8px;background:var(--sunk)}
.kpi-btn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.kpi-btn.alert{border-color:var(--danger)}
.kpi-btn.alert small{color:var(--danger);font-weight:700}
.payrow{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.payrow .days .input{height:38px;width:90px;font-size:15px}
.pgroup h4{margin:6px 0;font-family:var(--f-display);font-size:15px}
.has-bbar .toast{bottom:calc(var(--tabbar) + var(--bbar) + 16px + env(safe-area-inset-bottom,0px))}
/* offer banners */
.offer{border-radius:var(--r);overflow:hidden;background:#0D1422;display:flex;flex-direction:column;width:100%;max-width:440px;margin-inline:auto}
.offer-img{display:block;padding:0;border:0;background:none;cursor:zoom-in;width:100%}
.offer-img img{display:block;width:100%;height:auto;aspect-ratio:4/5}
.offer-fallback{display:none;padding:16px 14px 4px;color:#FFFFFF}
.offer-fallback b{display:block;font-family:var(--f-display);font-size:24px;margin:2px 0 4px}
.offer-fallback .op{font-family:var(--f-display);font-size:30px;font-weight:700;color:#FFFFFF;margin-top:6px}
.offer.noimg .offer-img{display:none} .offer.noimg .offer-fallback{display:block}
.offer-bar{display:flex;flex-direction:column;gap:4px;padding:10px 12px 8px}
.offer-bar .btn.ghost{color:#A9B4C8;align-self:center}
.offer-mini{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:var(--r);background:#0D1422;color:#FFFFFF}
.offer-mini .thumb{flex:none;width:56px;height:56px;border-radius:8px;overflow:hidden;padding:0;border:0;cursor:zoom-in;background:none}
.offer-mini .thumb img{width:100%;height:100%;object-fit:cover;object-position:50% 38%}
.om-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.om-t .eyebrow{color:#F5C842} .om-t b{font-family:var(--f-display);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .om-t .mono{font-size:13px;color:#C7D0DE}
.offer-mini .add{background:#E2261C;border-color:#E2261C;color:#FFFFFF}
.otag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:#E2261C;color:#FFFFFF;font-size:12px;font-weight:700;white-space:nowrap}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;min-height:0;flex:0 1 auto;max-height:calc(100% - 80px);object-fit:contain;border-radius:8px}
.lb-bar{width:100%;max-width:420px;display:flex;flex-direction:column}
.lb-x{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#FFFFFF;font-size:26px;line-height:1;cursor:pointer}
/* action bar above the tab bar */
.bbar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));z-index:6;min-height:var(--bbar);background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.07);display:flex;align-items:center;gap:12px;padding-block:8px}
.bbar .tot{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bbar .tot small{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.bbar .tot b{font-family:var(--f-display);font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bbar .btn{flex:1;max-width:340px;margin-left:auto}
/* order message to the clinic */
.msgcard{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--sunk)}
.msgbtns{display:flex;flex-direction:column;gap:8px}
.msgprev summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.msgprev pre{white-space:pre-wrap;font-family:var(--f-body);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0 0;max-height:260px;overflow:auto}
.installcard{border:2px solid var(--accent);gap:10px}
.installcard b{font-family:var(--f-display);font-size:16px}
/* small / large-text phones */
@media (max-width:359px){
  .gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .card{padding:13px}
  .prod,.cline,.order{padding-inline:11px}
  .sync{font-size:0;gap:0} .sync i{width:10px;height:10px}
  .tabbar button{font-size:11px}
  .brandmark small{display:none}
  .kpis{grid-template-columns:1fr}
  .bbar .tot b{font-size:18px}
}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.twocol{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){.twocol{grid-template-columns:1.1fr .9fr}}
@media (prefers-reduced-motion:no-preference){.prod,.ocard{transition:background-color .15s}}

#app{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>

/* ---------- storage (never throws) ---------- */
const MEM = {};
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? (k in MEM ? MEM[k] : d) : JSON.parse(v); } catch (e) { return k in MEM ? MEM[k] : d; } },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = (n, dp = 0) => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: dp, maximumFractionDigits: 2 });
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
const istDate = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const fmtTime = iso => new Date(iso).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "numeric", minute: "2-digit" });
const fmtDT = iso => new Date(iso).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const addDays = (ymd, n) => { const d = new Date(ymd + "T12:00:00+05:30"); d.setDate(d.getDate() + n); return istDate(d); };
let toastT;
function toast(msg) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- catalogue ---------- */
const RAW = JSON.parse(document.getElementById("catalog-data").textContent);
const CATS = RAW.cats;
const norm = s => String(s || "").toLowerCase().replace(/[®™]/g, "").replace(/x[\s-]?ray/g, "xray").replace(/h\s*\/\s*p\b/g, "hp").replace(/hand\s?pie?ce/g, "handpiece").replace(/(\d)(ml|gm|g|mm|kg|l)\b/g, "$1 $2").replace(/\b(gp|pp)(\d)/g, "$1 $2").replace(/[^a-z0-9.%]+/g, " ").trim();
const P = RAW.items.map(([code, name, brand, ci, generic, pack, mrp]) => {
  const p = { code, name, brand, ci, cat: CATS[ci], generic, pack, mrp };
  p.toks = [...new Set(norm([name, brand, generic, pack, CATS[ci]].join(" ")).split(" ").filter(Boolean))];
  p.nn = norm(name);

/* ---------- fuzzy search ---------- */
const SYN = {
  hp: ["handpiece", "airotor"], handpiece: ["hp"], airotor: ["hp", "highspeed"], gic: ["glass", "ionomer", "gi"],
  hypo: ["hypochlorite", "hypochlor", "hyposol", "chlorite"], naocl: ["hypochlorite", "hypochlor", "hyposol"],
  xray: ["rvg", "film"], rvg: ["sensor", "xray"], glove: ["gloves"], gloves: ["glove"], masks: ["mask"],
  rct: ["endo", "file", "sealer"], files: ["file"], burs: ["bur"], bur: ["burs"], la: ["injection", "spray"],
  composite: ["comp", "fusion", "curex", "recreate"], etchant: ["etch", "etching", "actino"], etch: ["etchant", "etching"],
  alginate: ["algitex", "imprint", "alfina", "chromatex"], scaler: ["uds", "ultrasonic"], lightcure: ["led", "light cure"],
  autoclave: ["steriliz", "sterilizer"], chair: ["dental chair"], cotton: ["roll", "rolls"], tray: ["trays"], apex: ["apex", "pex", "locator"],
  gp: ["gutta", "percha"], pp: ["paper", "points"], biorock: ["bio", "rock"], pmt: ["probe", "mirror", "tweezer"], blo: ["blow"], fibre: ["fiber"], fiber: ["fibre"], bioceramic: ["bio", "ceramic"], ttt: ["ttt"]
};
const lev = (a, b, max) => {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) { cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); best = Math.min(best, cur[j]); }
    if (best > max) return max + 1; prev = cur;
  }
  return prev[b.length];
};
const grams = s => { const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; };
const dice = (a, b) => { const A = grams(a), B = grams(b); let n = 0; A.forEach(x => B.has(x) && n++); return (2 * n) / (A.size + B.size || 1); };
function tokScore(q, t) {
  if (t === q) return 3;
  if (t.startsWith(q)) return q.length >= 2 ? 2.4 : (q.length === 1 ? 1.9 : 0);
  if (q.length >= 3 && t.includes(q)) return 1.9;
  if (q.length >= 4 && t.length >= 3) {
    const d = lev(q, t, 2);
    if (d === 1) return (q.length >= 5 ? 1.85 : 1.4) + 0.1 * dice(q, t);
    if (d === 2 && q.length >= 6) return 1.0;
    if (dice(q, t) >= 0.62) return 0.9;
  }
  return 0;
}
function searchProducts(query, pool) {
  const qn = norm(query); const qs = qn.split(" ").filter(Boolean);
  if (!qs.length) return { hits: pool, similar: [] };
  const hits = [], similar = [];
  for (const p of pool) {
    let total = 0, strong = 0, any = 0;
    for (const q of qs) {
      let best = 0;
      for (const alt of [q, ...(SYN[q] || [])]) for (const t of p.toks) { const s = tokScore(alt, t) * (alt === q ? 1 : 0.8); if (s > best) best = s; if (best === 3) break; }
      total += best; if (best >= 1.8) strong++; if (best >= 0.9) any++;
    }
    if (p.nn.startsWith(qn)) total += 3; else if (p.nn.includes(qn)) total += 1.5;
    if (strong === qs.length) hits.push([total, p]);
    else if (any > 0) similar.push([total, p]);
  }
  hits.sort((a, b) => b[0] - a[0]); similar.sort((a, b) => b[0] - a[0]);
  const H = hits.map(x => x[1]), Sm = similar.slice(0, 40).map(x => x[1]);
  // "nearby" products: same category & same generic/type as the best hit
  if (H.length && Sm.length < 12) {
    const top = H[0], seen = new Set([...H, ...Sm].map(p => p.code));
    const key = norm(top.generic || "").split(" ").filter(w => w.length > 3);
    const near = pool.filter(p => !seen.has(p.code) && p.ci === top.ci && (p.brand === top.brand || key.some(k => p.toks.includes(k))));
    Sm.push(...near.slice(0, 12 - Sm.length));
  }
  return { hits: H, similar: Sm };
}

async function rpc(fn, args) {
  if (!LIVE) { await new Promise(r => setTimeout(r, 120)); return Demo[fn](args); }
  let res;
  try {
    res = await fetch(CONFIG.SUPABASE_URL.trim().replace(/\/+$/, "").replace(/\/rest\/v1$/, "") + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: Object.assign({ apikey: CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json" }, CONFIG.SUPABASE_ANON_KEY.startsWith("eyJ") ? { Authorization: "Bearer " + CONFIG.SUPABASE_ANON_KEY } : {}),
      body: JSON.stringify(args)
    });
  } catch (e) { const er = new Error("No internet connection"); er.network = true; throw er; }
  const txt = await res.text(); let body = null; try { body = txt ? JSON.parse(txt) : null; } catch (e) { body = txt; }
  if (!res.ok) { const er = new Error((body && body.message) || "Server error (" + res.status + ")"); er.server = true; if (/SESSION_INVALID/.test(er.message)) er.session = true; throw er; }
  return body;
}

/* ---------- outbox: queue → send in order, retry when back online ---------- */
async function flush() {
  if (S.syncing || !S.outbox.length || !S.session || S.session.role !== "rep") return;
  S.syncing = true; let sent = 0;
  try {
    while (S.outbox.length) {
      const job = S.outbox[0];
      try {
        if (job.type === "visit") await rpc("rep_save_visit", { p_token: S.session.token, p_visit: job.payload });
        else if (job.type === "order") { const r = await rpc("rep_submit_order", { p_token: S.session.token, p_order: job.payload }); const l = S.log.find(x => x.client_id === job.payload.client_id); if (l) l.order_no = r.order_id; }
        else if (job.type === "update") await rpc("rep_update_order", { p_token: S.session.token, p_order: job.payload });
        else if (job.type === "delete") await rpc("rep_delete_order", { p_token: S.session.token, p_client_id: job.payload.client_id });
        else if (job.type === "payment") await rpc("rep_set_payment", { p_token: S.session.token, p_client_id: job.payload.client_id, p_status: job.payload.status, p_mode: job.payload.mode || null, p_credit_days: job.payload.credit_days || null });
        S.outbox.shift(); sent++; persist();
      } catch (e) {
        if (e.network) break;
        if (e.session) { S.session = null; store.del("so_session"); toast("Please sign in again. Unsent orders are kept on this phone."); S.syncing = false; render(); return; }
        if (job.type === "update" || job.type === "delete" || job.type === "payment") { S.outbox.shift(); S.notice = e.message; S.myOrders = null; persist(); toast(e.message); continue; }
        job.error = e.message; job.tries = (job.tries || 0) + 1;
        if (job.tries >= 5) { S.outbox.shift(); S.log.unshift({ kind: "failed", text: job.type + " could not be sent: " + e.message, at: new Date().toISOString() }); }
        persist(); break;
      }
    }
  } finally { S.syncing = false; updateSync(); if (S.tab === "orders" && S.session) { if (sent) S.myOrders = null; render(); } }
}
function updateSync() {
  const el = $(".sync"); if (!el) return; const n = S.outbox.length;
  el.classList.toggle("wait", !!n); el.innerHTML = `<i></i>${n ? n + " waiting to send" : "All sent"}`;
}

/* ---------- this rep's orders, with unsent changes applied ---------- */
function repOrders() {
  const ups = {}, pays = {}, dels = new Set();
  for (const j of S.outbox) { if (j.type === "update") ups[j.payload.client_id] = j.payload; else if (j.type === "payment") pays[j.payload.client_id] = j.payload; else if (j.type === "delete") dels.add(j.payload.client_id); }
  const sumOf = items => items.reduce((s, i) => s + i.qty * i.price, 0);
  const pending = S.outbox.filter(j => j.type === "order").map(j => withPay({ ...j.payload, total_value: sumOf(j.payload.items), status: "Order Received", _pend: true }, j.payload.payment));
  const list = (S.myOrders || []).filter(o => !dels.has(o.client_id)).map(o => {
    let x = o; const u = ups[o.client_id];
    if (u) x = withPay({ ...x, items: u.items, remarks: u.remarks, total_value: sumOf(u.items), _changed: true }, u.payment);
    if (pays[o.client_id]) x = withPay({ ...x, _changed: true }, pays[o.client_id]);
    return x;
  });
  return { pending, list };
}

const fullH = {};
function kbCheck() {
  const w = window.innerWidth, h = Math.min(window.innerHeight, window.visualViewport ? window.visualViewport.height : 1e9);
  fullH[w] = Math.max(fullH[w] || 0, window.innerHeight);
  const ae = document.activeElement, field = !!ae && ae.matches && ae.matches('input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=date]), textarea');
  const open = field && matchMedia("(pointer: coarse)").matches && h < fullH[w] * 0.8;
  if (open !== document.body.classList.contains("typing")) { document.body.classList.toggle("typing", open); if (open) setTimeout(() => ae.scrollIntoView({ block: "center" }), 60); }
}

window.addEventListener("appinstalled", () => { installEvt = null; const el = $("#install"); if (el) el.outerHTML = installHtml(); toast("App installed. Open it from your home screen."); });
try { if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}

/* ---------- boot ---------- */
render();
if (S.session && S.session.role === "admin") loadAdmin();
flush();
</script>
